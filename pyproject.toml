[project]
name = "meetingflow"
version = "0.1.0"
description = "本地会议音频转写工具"
requires-python = ">=3.12,<3.13"
dependencies = [
  "torch==2.8.0",
  "torchaudio==2.8.0",
  "torchvision==0.23.0",
  "whisperx==3.8.6",
]

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu128" }
torchaudio = { index = "pytorch-cu128" }
torchvision = { index = "pytorch-cu128" }

[project.scripts]
meetingflow = "meetingflow.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = ["pytest>=8.0", "ruff>=0.6"]

[tool.ruff]
line-length = 140
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "SIM"]
ignore = ["E501", "E701", "E702"]  # 保留项目紧凑的单行多语句风格

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
